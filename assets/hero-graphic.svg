<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="softAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05A47" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E05A47" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="warmTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0.01"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.75" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Base Card -->
  <rect x="20" y="20" width="560" height="640" rx="16" fill="url(#warmTone)" stroke="currentColor" stroke-opacity="0.1" stroke-width="1"/>
  
  <!-- Subtle Grid Overlay -->
  <rect x="20" y="20" width="560" height="640" rx="16" fill="url(#gridPattern)"/>

  <!-- Editorial Design Guides & Crop Marks -->
  <!-- Top-left crop marks -->
  <path d="M 10 35 L 25 35 M 35 10 L 35 25" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.2"/>
  <!-- Top-right crop marks -->
  <path d="M 590 35 L 575 35 M 565 10 L 565 25" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.2"/>
  <!-- Bottom-left crop marks -->
  <path d="M 10 645 L 25 645 M 35 670 L 35 655" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.2"/>
  <!-- Bottom-right crop marks -->
  <path d="M 590 645 L 575 645 M 565 670 L 565 655" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Ruler Marks along Top -->
  <g stroke="currentColor" stroke-opacity="0.2" stroke-width="1">
    <line x1="60" y1="20" x2="60" y2="30"/>
    <line x1="100" y1="20" x2="100" y2="26"/>
    <line x1="140" y1="20" x2="140" y2="30"/>
    <line x1="180" y1="20" x2="180" y2="26"/>
    <line x1="220" y1="20" x2="220" y2="30"/>
    <line x1="260" y1="20" x2="260" y2="26"/>
    <line x1="300" y1="20" x2="300" y2="30"/>
    <line x1="340" y1="20" x2="340" y2="26"/>
    <line x1="380" y1="20" x2="380" y2="30"/>
    <line x1="420" y1="20" x2="420" y2="26"/>
    <line x1="460" y1="20" x2="460" y2="30"/>
    <line x1="500" y1="20" x2="500" y2="26"/>
    <line x1="540" y1="20" x2="540" y2="30"/>
  </g>

  <!-- Specimen Canvas Frame -->
  <rect x="60" y="70" width="480" height="420" rx="10" fill="#FFFFFF" fill-opacity="0.6" stroke="currentColor" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Dot Matrix Accent Panel -->
  <rect x="80" y="90" width="120" height="120" fill="url(#dotPattern)"/>

  <!-- Minimal Geometric Composition Elements -->
  <!-- Accent Circle -->
  <circle cx="390" cy="200" r="85" fill="url(#softAccent)" stroke="#E05A47" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="390" cy="200" r="4" fill="#E05A47"/>

  <!-- Golden Ratio / Layout Arc -->
  <path d="M 120 400 A 200 200 0 0 1 320 200" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Central Editorial Typography "AF" -->
  <text x="300" y="320" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="110" font-weight="800" fill="currentColor" fill-opacity="0.9" text-anchor="middle" letter-spacing="-6">AF</text>
  
  <text x="300" y="355" font-family="'Space Grotesk', 'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#E05A47" text-anchor="middle" letter-spacing="4">DESIGN &amp; MARKETING</text>

  <line x1="200" y1="380" x2="400" y2="380" stroke="currentColor" stroke-opacity="0.18" stroke-width="1"/>
  <text x="300" y="405" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="10" font-weight="500" fill="currentColor" fill-opacity="0.45" text-anchor="middle" letter-spacing="2.5">EST. 2026 • KERALA, IN</text>

  <!-- Color Palette Swatch Pill -->
  <g transform="translate(60, 520)">
    <rect width="480" height="64" rx="8" fill="#FFFFFF" fill-opacity="0.8" stroke="currentColor" stroke-opacity="0.1" stroke-width="1"/>
    
    <!-- Color chips -->
    <circle cx="40" cy="32" r="14" fill="#121212"/>
    <circle cx="80" cy="32" r="14" fill="#5A5A58"/>
    <circle cx="120" cy="32" r="14" fill="#E05A47"/>
    <circle cx="160" cy="32" r="14" fill="#EFEFEA" stroke="currentColor" stroke-opacity="0.2"/>

    <text x="210" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="currentColor" fill-opacity="0.8">SYSTEM SPECIMEN</text>
    <text x="210" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="currentColor" fill-opacity="0.45">Grid: 8pt • Editorial Scale • Minimal Balance</text>
    
    <!-- Alignment icon -->
    <path d="M 440 24 L 460 24 M 440 32 L 452 32 M 440 40 L 458 40" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Floating Minimal Badge -->
  <g transform="translate(380, 50)">
    <rect width="140" height="34" rx="17" fill="#121212" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#E05A47"/>
    <text x="30" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">LEARNING &amp; CREATING</text>
  </g>
</svg>
